<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="description" content="LevelShift — A gamified SDET-1 interview prep platform. 15 minutes a day to level up your Java, OOP, and testing skills." />
    <meta name="theme-color" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Apply saved theme before first paint to avoid a flash of the wrong theme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('levelshift_theme');
          var root = document.documentElement;
          if (t === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', '#ffffff');
          }
        } catch (e) { /* storage disabled — fall back to dark */ }
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:title" content="LevelShift — SDET-1 Prep Platform" />
    <meta property="og:description" content="Gamified interview prep for SDET-1. 15 minutes a day. No excuses." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <title>LevelShift</title>
  </head>
  <body class="bg-surface-0 text-text-primary font-sans min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
